# conda env create -f environment.yml
name: pytao-dev
channels:
  - conda-forge
dependencies:
  - python >=3.10
  - bmad >=20261009.0
  - bokeh
  - h5py
  - httpcore >=1.0.9 # addresses a typing issue when launching jupyter lab
  - ipywidgets
  - jupyterlab>3
  - matplotlib
  - numpy
  - numpydoc
  - openpmd-beamphysics >=0.14.1
  - orjson
  - ormsgpack
  - pydantic >=2.12.5
  - rich
  - tqdm
  # Developer
  - markdown >3.10,<3.11
  - mkdocs
  - mkdocs-jupyter
  - mkdocs-material
  - mkdocstrings
  - mkdocstrings-python
  - pymdown-extensions <12 # Highlight api change issue
  - pygments
  - pytest
  - pytest-cov
  - pip
  - pyyaml
